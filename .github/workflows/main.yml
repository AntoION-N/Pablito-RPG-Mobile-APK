name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Pablito RPG 2D
        package.name = pablitorpg
        package.domain = org.yourname
        version = 1.0.0
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav
        requirements = python3,pygame,pillow
        orientation = landscape
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 33
        android.minapi = 21
        android.ndk = 28c
        android.sdk = 33
        android.build_tools = 33.0.2
        log_level = 2
        main.py = PablitoRPG_Mob.py
        EOF

    - name: Install aidl manually (with full path)
      run: |
        # Usar sdkmanager con ruta completa
        SDKMANAGER="/github/home/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
        if [ -f "$SDKMANAGER" ]; then
          echo "Instalando build-tools 33.0.2..."
          yes | $SDKMANAGER "build-tools;33.0.2" 2>/dev/null || true
          echo "Verificando aidl..."
          find /github/home/.buildozer -name "aidl" 2>/dev/null
        else
          echo "⚠️ sdkmanager no encontrado en $SDKMANAGER"
        fi

    - name: Build APK
      run: |
        echo "y" | buildozer android debug 2>&1 | tee build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pablito-rpg-apk
        path: bin/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
