name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK
      run: |
        # 1. Crear buildozer.spec desde cero
        cat > buildozer.spec << 'EOF'
        [app]
        title = Pablito RPG 2D
        package.name = pablitorpg
        package.domain = org.yourname
        version = 1.0.0
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav
        requirements = python3,pygame,pillow
        orientation = landscape
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 33
        android.minapi = 21
        android.ndk = 28c
        android.sdk = 33
        android.build_tools = 33.0.2
        log_level = 2
        main.py = PablitoRPG_Mob.py
        EOF

        # 2. Verificar que el archivo existe
        echo "=== Archivos en el directorio ==="
        ls -la
        echo "=== Archivo main.py ==="
        cat PablitoRPG_Mob.py | head -20 || echo "⚠️ No se encontró PablitoRPG_Mob.py"

        # 3. Compilar
        echo "=== Compilando APK ==="
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pablito-rpg-apk
        path: bin/*.apk
