name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK
      run: |
        buildozer init
        
        # Configurar buildozer.spec
        sed -i 's/^#.*requirements.*/requirements = python3,pygame,pillow/' buildozer.spec
        sed -i 's/^#.*android.api.*/android.api = 33/' buildozer.spec
        sed -i 's/^#.*android.minapi.*/android.minapi = 21/' buildozer.spec
        sed -i 's/^#.*android.ndk.*/android.ndk = 23b/' buildozer.spec
        sed -i 's/^#.*android.sdk.*/android.sdk = 33/' buildozer.spec
        sed -i 's/^#.*android.build_tools.*/android.build_tools = 33.0.2/' buildozer.spec
        sed -i 's/^#.*source.include_exts.*/source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav/' buildozer.spec
        echo "main.py = main.py" >> buildozer.spec
        echo "fullscreen = 1" >> buildozer.spec
        echo "orientation = landscape" >> buildozer.spec
        echo "package.name = pablitorpg" >> buildozer.spec
        echo "package.domain = org.yourname" >> buildozer.spec
        echo "title = Pablito RPG 2D" >> buildozer.spec
        echo "version = 1.0.0" >> buildozer.spec
        
        cat buildozer.spec
        buildozer android debug 2>&1 | tee build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pablito-rpg-apk
        path: bin/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
