name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
        python3-dev python3-virtualenv autoconf libtool pkg-config zlib1g-dev \
        libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
        libssl-dev automake autopoint gettext
        pip3 install --user --upgrade Cython==0.29.34
        pip3 install --user --upgrade python-for-android
        pip3 install --user --upgrade setuptools

    - name: Download Android SDK tools
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip -d android-sdk
        mkdir -p android-sdk/cmdline-tools/latest
        mv android-sdk/cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
        export ANDROID_HOME=$PWD/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:$PWD/android-sdk/cmdline-tools/latest/bin:$PWD/android-sdk/platform-tools" >> $GITHUB_ENV

    - name: Build APK with p4a
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        export PATH=$PATH:$JAVA_HOME/bin
        export PATH=$PATH:~/.local/bin
        
        # Verificar que p4a está instalado
        which p4a || echo "p4a not in PATH"
        python3 -m pip show python-for-android || echo "p4a not installed"
        
        # Crear directorio de trabajo
        mkdir -p .buildozer/android/platform
        
        # Usar p4a directamente (con ruta completa)
        ~/.local/bin/p4a apk \
          --private . \
          --package=org.yourname.pablitorpg \
          --name="Pablito RPG 2D" \
          --version=1.0.0 \
          --bootstrap=sdl2 \
          --requirements=python3,pygame,pillow \
          --android-api=33 \
          --android-min-api=21 \
          --android-ndk=r23b \
          --android-sdk=$ANDROID_HOME \
          --android-build-tools=33.0.2 \
          --orientation=landscape \
          --permission=INTERNET \
          --fullscreen \
          --debug \
          --dist-name=pablitorpg \
          --copy-libs \
          --arch=armeabi-v7a \
          --arch=arm64-v8a \
          --output=bin/ 2>&1 | tee build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pablito-rpg-apk
        path: bin/*.apk

    - name: Upload build log if failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
