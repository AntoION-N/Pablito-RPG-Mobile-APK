name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
        python3-virtualenv autoconf libtool pkg-config zlib1g-dev \
        libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
        libssl-dev automake autopoint gettext
        pip3 install --user --upgrade buildozer
        pip3 install --user --upgrade Cython==0.29.34

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Pablito RPG 2D
        package.name = pablitorpg
        package.domain = org.yourname
        version = 1.0.0
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf
        requirements = python3,pygame,pillow
        orientation = landscape
        fullscreen = 1
        android.permissions = INTERNET
        log_level = 2
        EOF

    - name: Build APK
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: pablito-rpg-apk
        path: bin/*.apk
