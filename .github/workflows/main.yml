name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
        python3-dev python3-virtualenv autoconf libtool pkg-config zlib1g-dev \
        libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
        libssl-dev automake autopoint gettext
        pip3 install --user --upgrade buildozer
        pip3 install --user --upgrade Cython==0.29.34

    - name: Create buildozer.spec (FORZANDO build-tools 33.0.2)
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Pablito RPG 2D
        package.name = pablitorpg
        package.domain = org.yourname
        version = 1.0.0
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav
        requirements = python3,pygame,pillow
        orientation = landscape
        fullscreen = 1
        android.permissions = INTERNET
        android.api = 33
        android.minapi = 21
        android.ndk = 23b
        android.sdk = 33
        android.build_tools = 33.0.2
        android.gradle_dependencies = ''
        log_level = 2
        main.py = main.py
        EOF
        
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Build APK
      run: |
        export PATH=$PATH:~/.local/bin
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        export PATH=$PATH:$JAVA_HOME/bin
        
        # Crear directorio para licencias
        mkdir -p ~/.android
        echo -e "count=0\nts_ms=1697151593159\ndisplay_name=Android SDK" > ~/.android/repositories.cfg
        
        # COMPILAR - IGNORANDO build-tools 37
        buildozer android debug 2>&1 | tee build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pablito-rpg-apk
        path: bin/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
