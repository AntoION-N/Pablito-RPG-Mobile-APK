name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (completo)
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
        python3-dev python3-virtualenv autoconf libtool pkg-config zlib1g-dev \
        libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
        libssl-dev automake autopoint gettext \
        gcc g++ make

    - name: Install Python packages
      run: |
        pip3 install --user --upgrade pip
        pip3 install --user --upgrade setuptools wheel
        pip3 install --user --upgrade buildozer
        pip3 install --user --upgrade Cython==0.29.34
        pip3 install --user --upgrade pygments

    - name: Create buildozer.spec (completo)
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Pablito RPG 2D
        package.name = pablitorpg
        package.domain = org.yourname
        version = 1.0.0

        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav
        source.exclude_exts = spec

        requirements = python3,pygame,pillow

        orientation = landscape
        fullscreen = 1

        android.permissions = INTERNET
        android.api = 33
        android.minapi = 21
        android.ndk = 23b
        android.sdk = 33
        android.build_tools = 33.0.2
        android.gradle_dependencies =

        osx.python_version = 3
        osx.kivy_version = 2.1.0

        log_level = 2

        main.py = main.py
        EOF

    - name: Setup Android SDK manually
      run: |
        export PATH=$PATH:~/.local/bin
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        export PATH=$PATH:$JAVA_HOME/bin

        # Crear estructura de directorios
        mkdir -p ~/.buildozer/android/platform
        mkdir -p ~/.android

        # Archivo de licencias
        echo -e "count=0\nts_ms=1697151593159\ndisplay_name=Android SDK" > ~/.android/repositories.cfg

        # Descargar SDK manualmente (si no existe)
        if [ ! -d ~/.buildozer/android/platform/android-sdk ]; then
          echo "📦 Descargando SDK manualmente..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/sdk.zip
          unzip -q /tmp/sdk.zip -d /tmp/sdk
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          mv /tmp/sdk/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          mv /tmp/sdk/* ~/.buildozer/android/platform/android-sdk/ 2>/dev/null || true
          rm -rf /tmp/sdk /tmp/sdk.zip
        fi

        export ANDROID_HOME=~/.buildozer/android/platform/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        # Aceptar TODAS las licencias
        echo "✅ Aceptando licencias de Android..."
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

        # Instalar build-tools 33.0.2
        echo "✅ Instalando build-tools 33.0.2..."
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" > /dev/null 2>&1 || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" > /dev/null 2>&1 || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" > /dev/null 2>&1 || true

        # Verificar aidl
        if [ -f ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl ]; then
          echo "✅ aidl encontrado en build-tools 33.0.2"
        else
          echo "⚠️ aidl no encontrado, intentando instalar build-tools 33.0.2 nuevamente..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" || true
        fi

        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV

    - name: Build APK (con todo el debug)
      run: |
        export PATH=$PATH:~/.local/bin
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        export PATH=$PATH:$JAVA_HOME/bin
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        echo "=== INFORMACIÓN DEL SISTEMA ==="
        python3 --version
        pip3 --version
        java -version
        echo "ANDROID_HOME: $ANDROID_HOME"

        echo "=== VERIFICANDO ARCHIVOS ==="
        ls -la
        echo "=== main.py ==="
        head -20 main.py

        echo "=== buildozer.spec ==="
        cat buildozer.spec

        echo "=== COMPILANDO APK ==="
        echo "y" | buildozer android debug 2>&1 | tee build.log

        # Verificar si el APK se generó
        if [ -f bin/*.apk ]; then
          echo "✅ APK generado exitosamente!"
          ls -la bin/
        else
          echo "❌ ERROR: No se generó el APK"
          echo "=== ÚLTIMAS 100 LÍNEAS DEL LOG ==="
          tail -100 build.log
          exit 1
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: pablito-rpg-apk
        path: bin/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload buildozer log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-log
        path: ~/.buildozer/logs/*.log
